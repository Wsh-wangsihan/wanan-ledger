<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>晚上好记账簿</title>
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="晚上好记账簿">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#1f2430;--sub:#8b93a5;--line:#eceef2;
  --exp:#ff5c5c;--inc:#22c55e;--primary:#4f7cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
button,input{font-family:inherit;font-size:inherit;}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}
input[type=date]{-webkit-appearance:none;appearance:none;}

header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.month-nav{display:flex;align-items:center;gap:4px;}
.month-nav button{
  width:32px;height:32px;border-radius:50%;border:none;background:#f1f3f7;color:#5a6274;
  font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;
}
.month-nav button:active{background:#e3e7ef;}
#monthLabel{font-size:17px;font-weight:600;min-width:110px;text-align:center;cursor:pointer;}
.tool-btn{
  border:none;background:#f1f3f7;color:#5a6274;border-radius:10px;
  padding:7px 11px;font-size:13px;cursor:pointer;
}
.tool-btn:active{background:#e3e7ef;}

main{padding:16px 16px calc(110px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(20,30,60,.05);}
h3{margin:0 0 12px;font-size:14px;font-weight:600;color:#5a6274;display:flex;
  align-items:center;justify-content:space-between;}
h3 small{font-weight:400;color:var(--sub);font-size:12px;}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;}
.summary .item span{display:block;font-size:12px;color:var(--sub);margin-bottom:7px;}
.summary .item b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.exp{color:var(--exp);}
.inc{color:var(--inc);}

.chart-wrap{position:relative;height:170px;}
canvas{width:100%;height:100%;display:block;}
.legend{margin-top:12px;display:flex;flex-direction:column;gap:9px;}
.lg-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.lg-row i{width:9px;height:9px;border-radius:3px;flex:none;}
.lg-name{flex:1;color:#4a5265;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lg-val{color:#1f2430;font-weight:600;font-variant-numeric:tabular-nums;}
.lg-pct{width:38px;text-align:right;color:var(--sub);font-size:12px;}
.bar-legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:var(--sub);}
.bar-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;}

.day-head{display:flex;justify-content:space-between;align-items:baseline;
  padding:12px 0 6px;font-size:12px;color:var(--sub);}
.day-head b{font-weight:500;color:#6b7385;}
.rec{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.rec:last-child{border-bottom:none;}
.rec .ico{width:38px;height:38px;border-radius:11px;background:#f4f6fa;
  display:grid;place-items:center;font-size:19px;flex:none;}
.rec .mid{flex:1;min-width:0;}
.rec .mid .n{font-size:15px;font-weight:500;}
.rec .mid .t{font-size:12px;color:var(--sub);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rec .amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.empty{text-align:center;color:#b9bfcc;font-size:13px;padding:26px 0;}
.footer-tools{display:flex;gap:10px;margin-top:4px;}
.footer-tools button{flex:1;border:none;background:#fff;border-radius:12px;padding:12px;
  font-size:13px;color:#5a6274;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,60,.05);}
.footer-tools button:active{background:#f7f8fb;}

#fab{
  position:fixed;right:calc(20px + env(safe-area-inset-right));
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:28px;border:none;
  background:linear-gradient(135deg,#6d9bff,#4f7cff);color:#fff;font-size:30px;font-weight:200;
  line-height:1;box-shadow:0 8px 20px rgba(79,124,255,.42);
  display:grid;place-items:center;cursor:pointer;z-index:30;transition:transform .12s;
}
#fab:active{transform:scale(.92);}

.modal{position:fixed;inset:0;z-index:50;background:rgba(15,20,35,.42);
  display:none;align-items:flex-end;justify-content:center;}
.modal.open{display:flex;}
.sheet{
  width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  animation:up .24s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow-y:auto;
}
@keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-head b{font-size:16px;}
.icon-btn{border:none;background:transparent;font-size:15px;color:var(--sub);
  padding:6px 8px;cursor:pointer;border-radius:8px;}
.icon-btn.danger{color:var(--exp);}
.type-tabs{display:flex;background:#f1f3f7;border-radius:12px;padding:4px;margin-bottom:16px;}
.type-tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:9px;
  font-size:15px;color:#6b7385;font-weight:500;cursor:pointer;transition:.15s;}
.type-tabs button.active{background:#fff;color:#1f2430;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.09);}
.amount-box{display:flex;align-items:center;gap:6px;padding:0 4px 14px;
  border-bottom:1px solid var(--line);margin-bottom:16px;}
.amount-box span{font-size:26px;font-weight:600;}
.amount-box input{flex:1;border:none;outline:none;font-size:30px;font-weight:700;
  width:100%;background:transparent;letter-spacing:-.02em;min-width:0;}
.amount-box input::placeholder{color:#d7dbe4;}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.cat{border:none;background:#f6f7fa;border-radius:12px;padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;transition:.15s;color:#5a6274;}
.cat .ci{font-size:20px;line-height:1;}
.cat .cn{font-size:11px;}
.cat.active{background:#eaf0ff;color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary);}
.field-row{margin-bottom:10px;}
.field-row input{width:100%;border:none;background:#f6f7fa;border-radius:12px;
  padding:13px 14px;font-size:15px;outline:none;color:var(--text);}
.field-row input:focus{background:#eef1f7;}
.primary-btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;
  font-weight:600;color:#fff;background:linear-gradient(135deg,#6d9bff,#4f7cff);
  box-shadow:0 6px 16px rgba(79,124,255,.3);cursor:pointer;margin-top:8px;}
.primary-btn:active{transform:scale(.985);}
.shake{animation:sh .3s;}
@keyframes sh{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
</style>
</head>
<body>

<header>
  <div class="month-nav">
    <button id="prevBtn" aria-label="上个月">‹</button>
    <div id="monthLabel">—</div>
    <button id="nextBtn" aria-label="下个月">›</button>
  </div>
  <button class="tool-btn" id="todayBtn">回到本月</button>
</header>

<main>
  <div class="card summary">
    <div class="item"><span>本月支出</span><b class="exp" id="sumExp">¥0.00</b></div>
    <div class="item"><span>本月收入</span><b class="inc" id="sumInc">¥0.00</b></div>
    <div class="item"><span>结余</span><b id="sumBal">¥0.00</b></div>
  </div>

  <div class="card">
    <h3>近 6 个月收支趋势</h3>
    <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    <div class="bar-legend">
      <span><i style="background:#ff5c5c"></i>支出</span>
      <span><i style="background:#22c55e"></i>收入</span>
    </div>
  </div>

  <div class="card">
    <h3>本月支出构成</h3>
    <div class="chart-wrap" style="height:160px"><canvas id="donut"></canvas></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="card">
    <h3>本月明细 <small id="countLabel"></small></h3>
    <div id="recordList"></div>
  </div>

  <div class="footer-tools">
    <button id="exportBtn">导出备份</button>
    <button id="importBtn">导入备份</button>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
</main>

<button id="fab" aria-label="记一笔">+</button>

<div class="modal" id="modal">
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <button class="icon-btn" id="closeBtn">关闭</button>
      <b id="sheetTitle">记一笔</b>
      <button class="icon-btn danger" id="deleteBtn" style="display:none">删除</button>
    </div>

    <div class="type-tabs" id="typeTabs">
      <button data-type="expense" class="active">支出</button>
      <button data-type="income">收入</button>
    </div>

    <div class="amount-box">
      <span>¥</span>
      <input id="amountInput" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
    </div>

    <div class="cats" id="cats"></div>

    <div class="field-row"><input id="dateInput" type="date"></div>
    <div class="field-row"><input id="noteInput" type="text" maxlength="30" placeholder="备注（可选）"></div>

    <button class="primary-btn" id="saveBtn">保存</button>
  </div>
</div>

<script>
const KEY = 'ledger.records.v1';

const CATS = {
  expense: [
    {id:'food',    name:'餐饮', icon:'🍜'},
    {id:'traffic', name:'交通', icon:'🚌'},
    {id:'shopping',name:'购物', icon:'🛍️'},
    {id:'home',    name:'居住', icon:'🏠'},
    {id:'fun',     name:'娱乐', icon:'🎮'},
    {id:'health',  name:'医疗', icon:'💊'},
    {id:'study',   name:'学习', icon:'📚'},
    {id:'other_e', name:'其他', icon:'📦'}
  ],
  income: [
    {id:'salary',  name:'工资', icon:'💼'},
    {id:'bonus',   name:'奖金', icon:'🎁'},
    {id:'parttime',name:'兼职', icon:'🧾'},
    {id:'invest',  name:'理财', icon:'📈'},
    {id:'redpack', name:'红包', icon:'🧧'},
    {id:'other_i', name:'其他', icon:'✨'}
  ]
};
const CAT_MAP = {};
CATS.expense.forEach(c => CAT_MAP[c.id] = c);
CATS.income.forEach(c => CAT_MAP[c.id] = c);

const PALETTE = ['#5B8DEF','#FF8A65','#4DD0A5','#FFD166','#B084F5','#F06292','#4FC3F7','#A1887F'];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function todayYM(){ return todayStr().slice(0,7); }

function money(n){
  const v = Number(n) || 0;
  return v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function shortMoney(n){
  const v = Number(n) || 0;
  if (v >= 10000) return (v/10000).toFixed(2) + '万';
  return v.toFixed(2);
}
function shortNum(v){
  if (v === 0) return '0';
  if (v >= 10000) return (v/10000).toFixed(v % 10000 === 0 ? 0 : 1) + '万';
  if (v >= 1000)  return (v/1000).toFixed(v % 1000 === 0 ? 0 : 1) + 'k';
  if (!Number.isInteger(v)) return v.toFixed(1);
  return String(v);
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function weekday(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return '周' + '日一二三四五六'[d.getDay()];
}
function niceStep(v){
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const m = v / e;
  let n;
  if (m <= 1) n = 1; else if (m <= 2) n = 2; else if (m <= 5) n = 5; else n = 10;
  return n * e;
}
function roundRectTop(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h);
  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
}

function loadRecords(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr.filter(r => r && r.date && typeof r.amount === 'number' && r.amount > 0)
              .map(r => ({
                id: r.id || uid(),
                date: r.date,
                type: r.type === 'income' ? 'income' : 'expense',
                cat: r.cat || (r.type === 'income' ? 'other_i' : 'other_e'),
                amount: Number(r.amount) || 0,
                note: r.note || ''
              }));
  }catch(e){ return []; }
}
function saveRecords(){
  try{ localStorage.setItem(KEY, JSON.stringify(records)); }
  catch(e){ alert('保存失败，可能是存储空间不足'); }
}

let records = loadRecords();
let curYM = todayYM();
let form = { type:'expense', cat:'food' };
let editingId = null;

function render(){
  const [y, m] = curYM.split('-').map(Number);
  $('#monthLabel').textContent = `${y}年${m}月`;

  const monthRecs = records.filter(r => r.date.slice(0,7) === curYM);
  let inc = 0, exp = 0;
  monthRecs.forEach(r => { if (r.type === 'income') inc += r.amount; else exp += r.amount; });

  $('#sumExp').textContent = '¥' + money(exp);
  $('#sumInc').textContent = '¥' + money(inc);
  const bal = inc - exp;
  const balEl = $('#sumBal');
  balEl.textContent = '¥' + money(bal);
  balEl.className = bal > 0 ? 'inc' : (bal < 0 ? 'exp' : '');

  const months = [];
  for (let i = 5; i >= 0; i--){
    const d = new Date(y, m - 1 - i, 1);
    const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    let mi = 0, me = 0;
    records.forEach(r => {
      if (r.date.slice(0,7) === key){
        if (r.type === 'income') mi += r.amount; else me += r.amount;
      }
    });
    months.push({ label: (d.getMonth()+1) + '月', income: mi, expense: me });
  }
  drawBars($('#barChart'), months);

  const catTotals = {};
  monthRecs.forEach(r => {
    if (r.type !== 'expense') return;
    catTotals[r.cat] = (catTotals[r.cat] || 0) + r.amount;
  });
  const items = Object.keys(catTotals).map(cat => ({
    name: (CAT_MAP[cat] || {name:'其他'}).name,
    value: catTotals[cat]
  })).sort((a,b) => b.value - a.value);
  items.forEach((it, i) => it.color = PALETTE[i % PALETTE.length]);

  drawDonut($('#donut'), items);
  renderLegend(items, exp);
  renderList(monthRecs);
}

function renderLegend(items, total){
  const el = $('#legend');
  if (!items.length){ el.innerHTML = ''; return; }
  el.innerHTML = items.map(it => `
    <div class="lg-row">
      <i style="background:${it.color}"></i>
      <span class="lg-name">${esc(it.name)}</span>
      <span class="lg-val">¥${money(it.value)}</span>
      <span class="lg-pct">${total ? (it.value / total * 100).toFixed(0) : 0}%</span>
    </div>`).join('');
}

function renderList(monthRecs){
  const el = $('#recordList');
  $('#countLabel').textContent = monthRecs.length ? `共 ${monthRecs.length} 笔` : '';

  if (!monthRecs.length){
    el.innerHTML = '<div class="empty">这个月还没有记录<br>点右下角 + 记一笔吧</div>';
    return;
  }

  const byDate = {};
  monthRecs.forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = [];
    byDate[r.date].push(r);
  });
  const dates = Object.keys(byDate).sort().reverse();

  let html = '';
  dates.forEach(date => {
    const list = byDate[date];
    let dayExp = 0, dayInc = 0;
    list.forEach(r => r.type === 'income' ? dayInc += r.amount : dayExp += r.amount);

    const parts = [];
    if (dayExp > 0) parts.push(`支出 ¥${money(dayExp)}`);
    if (dayInc > 0) parts.push(`收入 ¥${money(dayInc)}`);

    const d = new Date(date + 'T00:00:00');
    html += `<div class="day-head"><b>${d.getMonth()+1}月${d.getDate()}日 ${weekday(date)}</b>
             <span>${parts.join(' · ')}</span></div>`;

    list.sort((a,b) => b.amount - a.amount).forEach(r => {
      const c = CAT_MAP[r.cat] || {name:'其他', icon:'📦'};
      const sign = r.type === 'income' ? '+' : '-';
      const cls = r.type === 'income' ? 'inc' : 'exp';
      html += `<div class="rec" data-id="${r.id}">
        <div class="ico">${c.icon}</div>
        <div class="mid">
          <div class="n">${esc(c.name)}</div>
          ${r.note ? `<div class="t">${esc(r.note)}</div>` : ''}
        </div>
        <div class="amt ${cls}">${sign}${money(r.amount)}</div>
      </div>`;
    });
  });
  el.innerHTML = html;
}

function setupCanvas(canvas){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = canvas.clientWidth || 300;
  const h = canvas.clientHeight || 160;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

function drawBars(canvas, data){
  const { ctx, w, h } = setupCanvas(canvas);
  const padL = 40, padR = 10, padT = 14, padB = 26;
  const cw = w - padL - padR;
  const ch = h - padT - padB;
  if (cw <= 10 || ch <= 10) return;

  const maxV = Math.max(1, ...data.map(d => Math.max(d.income, d.expense)));
  const step = niceStep(maxV / 4);
  const top = Math.max(step, Math.ceil(maxV / step) * step);

  ctx.font = '10px -apple-system,sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const ticks = Math.round(top / step);
  for (let i = 0; i <= ticks; i++){
    const v = step * i;
    const y = padT + ch - (v / top) * ch;
    ctx.strokeStyle = i === 0 ? '#dfe3ec' : '#f0f2f6';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, Math.round(y) + 0.5);
    ctx.lineTo(padL + cw, Math.round(y) + 0.5);
    ctx.stroke();
    ctx.fillStyle = '#a8afbd';
    ctx.fillText(shortNum(v), padL - 6, y);
  }

  const groupW = cw / data.length;
  const barW = Math.min(14, groupW * 0.26);
  const gap = Math.max(2, barW * 0.22);

  data.forEach((d, i) => {
    const gx = padL + groupW * i + groupW / 2;
    const drawBar = (val, color, offset) => {
      if (val <= 0) return;
      const bh = Math.max(2, (val / top) * ch);
      const x = gx + offset - barW / 2;
      const y = padT + ch - bh;
      ctx.fillStyle = color;
      roundRectTop(ctx, x, y, barW, bh, Math.min(4, barW / 2));
      ctx.fill();
    };
    drawBar(d.expense, '#ff5c5c', -(barW / 2 + gap / 2));
    drawBar(d.income,  '#22c55e',  (barW / 2 + gap / 2));

    ctx.fillStyle = '#8b93a5';
    ctx.font = '10px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(d.label, gx, padT + ch + 8);
  });
}

function drawDonut(canvas, items){
  const { ctx, w, h } = setupCanvas(canvas);
  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) / 2 - 4;
  const r = R * 0.62;
  const total = items.reduce((s, i) => s + i.value, 0);

  if (total <= 0){
    ctx.beginPath();
    ctx.arc(cx, cy, (R + r) / 2, 0, Math.PI * 2);
    ctx.strokeStyle = '#eef0f5';
    ctx.lineWidth = R - r;
    ctx.stroke();
    ctx.fillStyle = '#b9bfcc';
    ctx.font = '13px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('暂无支出', cx, cy);
    return;
  }

  let a = -Math.PI / 2;
  items.forEach(it => {
    const ang = it.value / total * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, R, a, a + ang);
    ctx.arc(cx, cy, r, a + ang, a, true);
    ctx.closePath();
    ctx.fillStyle = it.color;
    ctx.fill();
    a += ang;
  });

  ctx.fillStyle = '#1f2430';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 15px -apple-system,sans-serif';
  ctx.fillText('¥' + shortMoney(total), cx, cy - 9);
  ctx.font = '11px -apple-system,sans-serif';
  ctx.fillStyle = '#8b93a5';
  ctx.fillText('本月支出', cx, cy + 10);
}

function renderTypeTabs(){
  $('#typeTabs').querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.type === form.type);
  });
}
function renderCats(){
  const list = CATS[form.type];
  if (!list.some(c => c.id === form.cat)) form.cat = list[0].id;
  $('#cats').innerHTML = list.map(c => `
    <button class="cat ${c.id === form.cat ? 'active' : ''}" data-cat="${c.id}">
      <span class="ci">${c.icon}</span><span class="cn">${c.name}</span>
    </button>`).join('');
}

function openSheet(record){
  editingId = record ? record.id : null;
  form.type = record ? record.type : 'expense';
  form.cat = record ? record.cat : (form.type === 'income' ? 'salary' : 'food');

  $('#amountInput').value = record ? record.amount : '';
  $('#dateInput').value = record ? record.date : todayStr();
  $('#noteInput').value = record ? record.note : '';
  $('#sheetTitle').textContent = record ? '编辑记录' : '记一笔';
  $('#deleteBtn').style.display = record ? 'block' : 'none';

  renderTypeTabs();
  renderCats();
  $('#modal').classList.add('open');

  if (!record) setTimeout(() => $('#amountInput').focus(), 120);
}
function closeSheet(){
  $('#modal').classList.remove('open');
  editingId = null;
  $('#amountInput').blur();
  $('#noteInput').blur();
}

$('#prevBtn').onclick = () => {
  const [y, m] = curYM.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  curYM = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  render();
};
$('#nextBtn').onclick = () => {
  const [y, m] = curYM.split('-').map(Number);
  const d = new Date(y, m, 1);
  curYM = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  render();
};
$('#monthLabel').onclick = () => { curYM = todayYM(); render(); };
$('#todayBtn').onclick = () => { curYM = todayYM(); render(); };

$('#fab').onclick = () => openSheet(null);
$('#closeBtn').onclick = closeSheet;
$('#modal').addEventListener('click', e => {
  if (e.target === $('#modal')) closeSheet();
});

$('#typeTabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  form.type = btn.dataset.type;
  form.cat = CATS[form.type][0].id;
  renderTypeTabs();
  renderCats();
});

$('#cats').addEventListener('click', e => {
  const btn = e.target.closest('.cat');
  if (!btn) return;
  form.cat = btn.dataset.cat;
  renderCats();
});

$('#saveBtn').onclick = () => {
  const raw = $('#amountInput').value.trim();
  const amount = Math.round(parseFloat(raw) * 100) / 100;
  if (!raw || !isFinite(amount) || amount <= 0){
    const box = document.querySelector('.amount-box');
    box.classList.remove('shake');
    void box.offsetWidth;
    box.classList.add('shake');
    $('#amountInput').focus();
    return;
  }
  const date = $('#dateInput').value || todayStr();
  const note = $('#noteInput').value.trim().slice(0, 30);

  if (editingId){
    const r = records.find(x => x.id === editingId);
    if (r) Object.assign(r, { type: form.type, cat: form.cat, amount, date, note });
  } else {
    records.push({ id: uid(), type: form.type, cat: form.cat, amount, date, note });
  }
  saveRecords();
  curYM = date.slice(0, 7);
  closeSheet();
  render();
};

$('#deleteBtn').onclick = () => {
  if (!editingId) return;
  if (!confirm('确定要删除这条记录吗？')) return;
  records = records.filter(r => r.id !== editingId);
  saveRecords();
  closeSheet();
  render();
};

$('#recordList').addEventListener('click', e => {
  const row = e.target.closest('.rec');
  if (!row) return;
  const rec = records.find(r => r.id === row.dataset.id);
  if (rec) openSheet(rec);
});

$('#exportBtn').onclick = () => {
  const data = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), records }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `记账备份_${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
};

$('#importBtn').onclick = () => $('#fileInput').click();

$('#fileInput').onchange = e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const obj = JSON.parse(reader.result);
      const arr = Array.isArray(obj) ? obj : obj.records;
      if (!Array.isArray(arr)) throw new Error('格式不对');
      if (!confirm(`将导入 ${arr.length} 条记录，导入后会与现有记录合并，继续吗？`)) return;

      const existing = new Set(records.map(r => r.id));
      let added = 0;
      arr.forEach(r => {
        if (!r || !r.date || !(Number(r.amount) > 0)) return;
        const id = r.id && !existing.has(r.id) ? r.id : uid();
        existing.add(id);
        records.push({
          id,
          date: String(r.date).slice(0, 10),
          type: r.type === 'income' ? 'income' : 'expense',
          cat: r.cat || 'other_e',
          amount: Math.round(Number(r.amount) * 100) / 100,
          note: String(r.note || '').slice(0, 30)
        });
        added++;
      });
      saveRecords();
      render();
      alert(`成功导入 ${added} 条记录`);
    }catch(err){
      alert('导入失败：文件格式不正确');
    }finally{
      e.target.value = '';
    }
  };
  reader.readAsText(file);
};

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 180);
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

render();
</script>
</body>
</html>
